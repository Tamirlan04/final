<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styletemplate.css">
</head>
<body>
<!-- ===== HEADER ===== -->
  <header class="site-header">
    <nav class="navbar navbar-expand-md navbar-dark" style="background: var(--glass); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);">
      <a class="navbar-brand d-flex align-items-center" href="Main page.html">
        <img src="/pictures/logo.png" alt="Logo" style="height:40px; margin-right:10px;">
        <span>TezPrint</span>
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
          <li class="nav-item"><a class="nav-link" href="order.html">Order</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
        </ul>
        <button id="themeToggle" class="theme-toggle-btn">Change Mode</button>
      </div>
    </nav>
  </header>
  <div class="container">
    <div class="header-bar">Log In</div>

    <main class="main" align="center">
      <h3>Log in</h3>
      <hr>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required />
        <br><br>

        <input type="password" id="password" placeholder="Password" required />
        <br><br>

        <button type="submit">Login</button>
      </form>
      <p id="error" style="color:red;"></p>
      <hr>
      <p>Have not account? <a href="register.html"> Sign Up</a></p>
    </main>

    <div class="footer-bar">+7 778 087 82 51 | TezPrint</div>
  </div>
<button id="logoutBtn" class="theme-toggle-btn">Logout</button>

  <script src="login.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="theme.js"></script>
</body>
</html>
